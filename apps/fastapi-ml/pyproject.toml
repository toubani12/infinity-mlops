[project]
name = "fastapi-ml"
version = "0.1.0"
description = "Fraud scoring service: REST, Kafka scoring and prediction logging"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiokafka>=0.14.0",
    "fastapi>=0.162.0",
    "mlflow==3.17.2",
    "pandas>=3.1.0",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
    "xgboost-cpu==3.4.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema[format-nongpl]>=4.26.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
