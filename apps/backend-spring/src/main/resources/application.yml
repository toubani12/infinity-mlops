spring:
  application:
    name: backend-spring
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/infinity}
    username: ${SPRING_DATASOURCE_USERNAME:infinity}
    password: ${SPRING_DATASOURCE_PASSWORD:infinity}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: backend-spring
      auto-offset-reset: earliest

infinity:
  security:
    jwt-secret: ${JWT_SECRET:}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    token-ttl: 8h
  stream:
    timeout: 30m
    reconnect: 3s
    heartbeat-ms: 15000
  alerts:
    threshold: ${ALERT_THRESHOLD:0.5}
  outbox:
    enabled: true
    batch-size: 500
    send-timeout: 10s
    poll-interval-ms: 200

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
