[project]
name = "pipelines"
version = "0.1.0"
description = "Ingestion, validation, training and registry jobs for the fraud model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.118",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=data --cov=training --cov-report=term-missing"
