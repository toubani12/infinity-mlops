[project]
name = "pipelines"
version = "0.1.0"
description = "Ingestion, validation, training and registry jobs for the fraud model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.14.0",
    "boto3>=1.43.118",
    "mlflow==3.17.2",
    "numpy>=2.5.4",
    "pandas>=2.2",
    "pyarrow>=21",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "xgboost-cpu==3.4.1",
]

[dependency-groups]
dev = [
    "jsonschema[format-nongpl]>=4.26.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=data --cov=training --cov=registry --cov-report=term-missing"
