# Who may reach Kafka, PostgreSQL, MinIO and MLflow. Pods labelled app.kubernetes.io/component
# retrain (Jobs the agent creates) or bootstrap (scripts/e2e) run the pipelines image.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 9092
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend-spring
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fastapi-ml
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agents-langgraph
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: drift-monitor
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka-topics
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pipelines
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 5432
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend-spring
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mlflow
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agents-langgraph
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-minio
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minio
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 9000
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mlflow
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fastapi-ml
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: drift-monitor
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agents-langgraph
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minio-buckets
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [retrain, bootstrap]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mlflow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 5000
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fastapi-ml
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agents-langgraph
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: drift-monitor
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [retrain, bootstrap]
