apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ingress only: egress stays open, so DNS, the Kubernetes API (agent, Prometheus discovery) and
# image pulls need no rule. Enforced only by a CNI that implements NetworkPolicy.
resources:
  - default-deny.yaml
  - data-stores.yaml
  - services.yaml
