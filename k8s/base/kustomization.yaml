apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: infinity

labels:
  - pairs:
      app.kubernetes.io/part-of: infinity-mlops

resources:
  - namespace.yaml
  - kafka
  - postgres
  - minio
  - mlflow
  - backend-spring
  - fastapi-ml
  - frontend-next
  - agents-langgraph
  - drift-monitor
  - observability
  - network-policies

# platform-config and platform-secrets keep stable names: the retrain Job created at runtime by
# the agent references them by name, and kustomize cannot rewrite a hash suffix it never sees.
configMapGenerator:
  - name: platform-config
    options:
      disableNameSuffixHash: true
    literals:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - S3_ENDPOINT_URL=http://minio:9000
      - MODEL_NAME=fraud-xgb
