apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - prometheus-rbac.yaml
  - prometheus.yaml
  - grafana.yaml

# Hashed names roll the pods when a scrape config or the dashboard changes. Compose mounts the
# same Grafana files from this folder.
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus/prometheus.yml
  - name: grafana-datasources
    files:
      - grafana/provisioning/datasources/prometheus.yaml
  - name: grafana-dashboard-providers
    files:
      - grafana/provisioning/dashboards/infinity-mlops.yaml
  - name: grafana-dashboards
    files:
      - grafana/dashboards/infinity-mlops.json
