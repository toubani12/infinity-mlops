apiVersion: apps/v1
kind: Deployment
metadata:
  name: agents-langgraph
  labels:
    app.kubernetes.io/name: agents-langgraph
spec:
  # One agent at a time: it owns the single in-flight retrain and the checkpointed graph state.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agents-langgraph
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agents-langgraph
    spec:
      serviceAccountName: agents-langgraph
      containers:
        - name: agents-langgraph
          image: ghcr.io/toubani12/infinity-mlops/agents-langgraph:latest
          ports:
            - name: http
              containerPort: 8100
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/agent
            - name: LLM_PROVIDER
              value: none
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
