apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-spring
  labels:
    app.kubernetes.io/name: backend-spring
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-spring
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-spring
    spec:
      containers:
        - name: backend-spring
          image: ghcr.io/toubani12/infinity-mlops/backend-spring:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/infinity
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: JWT_SECRET
            - name: ALERT_THRESHOLD
              value: "0.5"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
