apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-ml
  labels:
    app.kubernetes.io/name: fastapi-ml
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fastapi-ml
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fastapi-ml
    spec:
      containers:
        - name: fastapi-ml
          image: ghcr.io/toubani12/infinity-mlops/fastapi-ml:latest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: FRAUD_THRESHOLD
              value: "0.5"
            - name: KAFKA_ENABLED
              value: "true"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
