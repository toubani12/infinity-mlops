apiVersion: batch/v1
kind: Job
metadata:
  name: minio-buckets
  labels:
    app.kubernetes.io/name: minio-buckets
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-buckets
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-buckets
          image: minio/mc:RELEASE.2025-04-16T18-13-26Z
          command:
            - sh
            - -c
            - |
              set -e
              mc alias set local http://minio:9000 "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY"
              for bucket in mlflow datasets predictions drift-reports; do
                mc mb --ignore-existing "local/$bucket"
              done
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: MC_CONFIG_DIR
              value: /tmp/mc
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
