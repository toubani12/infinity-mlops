apiVersion: batch/v1
kind: CronJob
metadata:
  name: drift-monitor
  labels:
    app.kubernetes.io/name: drift-monitor
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: drift-monitor
        spec:
          restartPolicy: Never
          containers:
            - name: drift-monitor
              image: ghcr.io/toubani12/infinity-mlops/drift-monitor:latest
              envFrom:
                - configMapRef:
                    name: platform-config
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: platform-secrets
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: platform-secrets
                      key: AWS_SECRET_ACCESS_KEY
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  memory: 1Gi
