# Test copy of the retrain template shape from docs/architecture/retrain-contract.md.
# The real template is k8s/jobs/retrain-job.yaml, owned by the pipelines team.
apiVersion: batch/v1
kind: Job
metadata:
  name: retrain-template
  labels:
    app.kubernetes.io/part-of: infinity-mlops
    app.kubernetes.io/component: retrain
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/component: retrain
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: ghcr.io/toubani12/infinity-mlops/pipelines:latest
          command: ["python", "-m", "training.retrain"]
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          env:
            - name: WINDOW_DAYS
              value: "7"
            - name: LOG_LEVEL
              value: INFO
