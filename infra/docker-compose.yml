name: infinity-mlops

x-minio-credentials: &minio-credentials
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minio}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minio12345}

services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 12

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ./kafka/create-topics.sh:/opt/init/create-topics.sh:ro
    entrypoint: ["bash", "/opt/init/create-topics.sh"]
    restart: "no"

  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infinity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infinity}
      POSTGRES_DB: infinity
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP on 127.0.0.1 only answers once the init scripts are done and the final server is up.
      test: ["CMD-SHELL", "PGPASSWORD=$${POSTGRES_PASSWORD} psql -h 127.0.0.1 -U $${POSTGRES_USER} -d agent -c 'select 1' > /dev/null"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12

  minio:
    # MinIO stopped publishing images on Docker Hub and Quay; the Bitnami legacy build
    # ships the same server plus mc and curl.
    image: bitnamilegacy/minio:2025.7.23
    entrypoint: ["minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    user: "0"
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minio}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minio12345}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 12

  minio-init:
    image: bitnamilegacy/minio:2025.7.23
    depends_on:
      minio:
        condition: service_healthy
    environment:
      <<: *minio-credentials
      MC_CONFIG_DIR: /tmp/mc
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$AWS_ACCESS_KEY_ID" "$$AWS_SECRET_ACCESS_KEY"
        for bucket in mlflow datasets predictions drift-reports; do
          mc mb --ignore-existing "local/$$bucket"
        done
    restart: "no"

  mlflow:
    build: ./mlflow
    image: infinity-mlops/mlflow:local
    ports:
      - "${MLFLOW_HOST_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *minio-credentials
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-infinity}:${POSTGRES_PASSWORD:-infinity}@postgres:5432/mlflow
      MLFLOW_ARTIFACTS_DESTINATION: s3://mlflow
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_WORKERS: 2
      MLFLOW_SERVER_ALLOWED_HOSTS: mlflow,mlflow:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  backend-spring:
    profiles: [apps]
    build: ../apps/backend-spring
    image: ghcr.io/toubani12/infinity-mlops/backend-spring:local
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/infinity
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-infinity}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-infinity}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ALERT_THRESHOLD: ${ALERT_THRESHOLD:-0.5}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}

  fastapi-ml:
    profiles: [apps]
    build: ../apps/fastapi-ml
    image: ghcr.io/toubani12/infinity-mlops/fastapi-ml:local
    ports:
      - "${INFERENCE_HOST_PORT:-8000}:8000"
    depends_on:
      mlflow:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *minio-credentials
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      S3_ENDPOINT_URL: http://minio:9000
      MODEL_NAME: ${MODEL_NAME:-fraud-xgb}
      FRAUD_THRESHOLD: ${FRAUD_THRESHOLD:-0.5}
      KAFKA_ENABLED: "true"

  agents-langgraph:
    profiles: [apps]
    build: ../services/agents-langgraph
    image: ghcr.io/toubani12/infinity-mlops/agents-langgraph:local
    ports:
      - "${AGENT_HOST_PORT:-8100}:8100"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *minio-credentials
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MODEL_NAME: ${MODEL_NAME:-fraud-xgb}
      DATABASE_URL: postgresql://${POSTGRES_USER:-infinity}:${POSTGRES_PASSWORD:-infinity}@postgres:5432/agent
      LLM_PROVIDER: ${LLM_PROVIDER:-none}

  drift-monitor:
    profiles: [apps]
    build: ../services/drift-monitor
    image: ghcr.io/toubani12/infinity-mlops/drift-monitor:local
    depends_on:
      minio-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *minio-credentials
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_TRACKING_URI: http://mlflow:5000
    restart: "no"

  frontend-next:
    profiles: [apps]
    build:
      context: ../apps/frontend-next
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    image: ghcr.io/toubani12/infinity-mlops/frontend-next:local
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      - backend-spring
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}

  prometheus:
    profiles: [apps]
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # Provisioning and dashboard are shared with Kubernetes, which builds its ConfigMaps from them.
  grafana:
    profiles: [apps]
    image: grafana/grafana:12.1.0
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/infinity-mlops.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ../k8s/base/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../k8s/base/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../k8s/base/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  kafka-data:
  postgres-data:
  minio-data:
  prometheus-data:
