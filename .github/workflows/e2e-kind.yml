name: e2e-kind

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-kind-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/toubani12/infinity-mlops
  KIND_CLUSTER: infinity-e2e
  # name:build context, the same list as build-images.yml
  IMAGES: >-
    mlflow:infra/mlflow
    backend-spring:apps/backend-spring
    fastapi-ml:apps/fastapi-ml
    frontend-next:apps/frontend-next
    agents-langgraph:services/agents-langgraph
    drift-monitor:services/drift-monitor
    pipelines:pipelines

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for the images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      # Exposes the cache token to run steps, so buildx reuses the layers build-images.yml cached.
      - uses: crazy-max/ghaction-github-runtime@v3

      - name: Build images
        run: |
          for spec in $IMAGES; do
            name=${spec%%:*}
            context=${spec#*:}
            echo "::group::$name"
            build_args=()
            if [ "$name" = frontend-next ]; then
              build_args+=(--build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8080)
            fi
            docker buildx build --load --cache-from "type=gha,scope=$name" \
              ${build_args[@]+"${build_args[@]}"} -t "$IMAGE_PREFIX/$name:ci" "$context"
            echo "::endgroup::"
          done
          # The agent creates retrain Jobs from k8s/jobs/retrain-job.yaml, which names the :latest tag.
          docker tag "$IMAGE_PREFIX/pipelines:ci" "$IMAGE_PREFIX/pipelines:latest"

      - uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.KIND_CLUSTER }}
          wait: 120s

      - name: Load images into kind
        run: |
          for spec in $IMAGES; do
            kind load docker-image "$IMAGE_PREFIX/${spec%%:*}:ci" --name "$KIND_CLUSTER"
          done
          kind load docker-image "$IMAGE_PREFIX/pipelines:latest" --name "$KIND_CLUSTER"

      - name: Deploy the ci-kind overlay
        run: kubectl apply -k k8s/overlays/ci-kind

      - name: Run the short demo scenario
        env:
          PIPELINES_IMAGE: ${{ env.IMAGE_PREFIX }}/pipelines:ci
          ROLLOUT_TIMEOUT: 600s
        run: scripts/e2e/demo-short.sh

      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n infinity get pods,jobs,svc -o wide || true
          kubectl -n infinity get events --sort-by=.lastTimestamp | tail -n 60 || true
          for workload in deployment/agents-langgraph deployment/fastapi-ml deployment/backend-spring deployment/mlflow; do
            echo "::group::logs $workload"
            kubectl -n infinity logs "$workload" --tail 200 --all-containers || true
            echo "::endgroup::"
          done
          for job in $(kubectl -n infinity get jobs -o name); do
            echo "::group::logs $job"
            kubectl -n infinity logs "$job" --tail 100 || true
            echo "::endgroup::"
          done
