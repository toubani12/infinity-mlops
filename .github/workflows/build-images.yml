name: build-images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  IMAGE_PREFIX: ghcr.io/toubani12/infinity-mlops

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend-spring: ['apps/backend-spring/**']
            fastapi-ml: ['apps/fastapi-ml/**']
            frontend-next: ['apps/frontend-next/**']
            agents-langgraph: ['services/agents-langgraph/**']
            drift-monitor: ['services/drift-monitor/**']
            pipelines: ['pipelines/**']
            mlflow: ['infra/mlflow/**']
            workflow: ['.github/workflows/build-images.yml']
      - id: select
        env:
          CHANGED: ${{ steps.filter.outputs.changes || '[]' }}
          BUILD_ALL: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || contains(steps.filter.outputs.changes, 'workflow') }}
        run: |
          services="backend-spring:apps/backend-spring
          fastapi-ml:apps/fastapi-ml
          frontend-next:apps/frontend-next
          agents-langgraph:services/agents-langgraph
          drift-monitor:services/drift-monitor
          pipelines:pipelines
          mlflow:infra/mlflow"
          entries=()
          while IFS=: read -r name context; do
            if [ "$BUILD_ALL" != true ] && ! jq -e --arg n "$name" 'index($n)' <<< "$CHANGED" > /dev/null; then
              continue
            fi
            if [ ! -f "$context/Dockerfile" ]; then
              echo "::notice::skip $name, $context/Dockerfile does not exist yet"
              continue
            fi
            entries+=("$(jq -cn --arg s "$name" --arg c "$context" '{service: $s, context: $c}')")
          done <<< "$services"
          matrix=$(printf '%s\n' "${entries[@]}" | jq -cs .)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "images to build: $matrix"

  build:
    needs: select
    if: needs.select.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
